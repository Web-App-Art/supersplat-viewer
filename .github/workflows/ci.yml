name: CI

# ARTLIGHT: workflow hérité de l'amont PlayCanvas. Verrouillé sur le propriétaire
# du dépôt, comme publish.yml l'est déjà : notre fork valide en local (tsc, lint,
# build) avant déploiement, et le job Lint est rouge par construction tant que la
# dette d'ESLint n'est pas traitée. Un `if` plutôt qu'une suppression du fichier :
# l'amont le retouche à presque chaque version, et un conflit modify/delete à
# chaque montée coûterait plus cher que ces deux lignes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'playcanvas' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js 18.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "npm"
          registry-url: "https://registry.npmjs.org/"

      - name: Install Dependencies
        run: npm ci

      - name: Build SuperSplat Viewer
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'playcanvas' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js 18.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "npm"
          registry-url: "https://registry.npmjs.org/"

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
